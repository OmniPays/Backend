name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      API_KEY: test-api-key
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/omnipays?schema=public
      PORT: '4000'
      BACKEND_URL: http://localhost:4000
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MERCURY_TESTNET_BACKEND_ENDPOINT: https://example.com/testnet/backend
      MERCURY_TESTNET_GRAPHQL_ENDPOINT: https://example.com/testnet/graphql
      MERCURY_BACKEND_ENDPOINT: https://example.com/mainnet/backend
      MERCURY_GRAPHQL_ENDPOINT: https://example.com/mainnet/graphql
      MERCURY_EMAIL: ci@example.com
      MERCURY_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: yarn test --runInBand
